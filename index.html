<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひと目トーク</title>
<meta name="description" content="耳が聞こえる人と聞こえない人が、ボタンと大きな文字で素早く意思疎通するためのツール。">
<meta name="theme-color" content="#0B5CAD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 実行環境が与えていた土台 */
[hidden] { display: none !important; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* layout: 画面を2分割。横長なら 左=大きな表示 / 右=ボタン。縦長なら 上=表示 / 下=ボタン。
   色は「聞こえる人=青」「聞こえない人=橙」「どちらでも=灰青」。色だけに頼らず、ラベル・形・✓でも区別する。 */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #101820;
  --ink-2: #404C58;
  --line: #6F7B87;
  --focus: #6B21A8;

  --h-bg: #E3EEFB; --h-ink: #07243F; --h-edge: #0B5CAD; --h-solid: #0B5CAD; --h-on: #FFFFFF;
  --d-bg: #FFEFD9; --d-ink: #3E1F00; --d-edge: #9A3F00; --d-solid: #9A3F00; --d-on: #FFFFFF;
  --a-bg: #E4EDEF; --a-ink: #102A30; --a-edge: #35616B; --a-solid: #2B5560; --a-on: #FFFFFF;

  --font: 'BIZ UDPGothic', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1216;
    --surface: #171D23;
    --ink: #F1F5F9;
    --ink-2: #B6C2CE;
    --line: #6B7A8A;
    --focus: #FFD60A;

    --h-bg: #10304F; --h-ink: #E8F2FF; --h-edge: #6DB0FF; --h-solid: #6DB0FF; --h-on: #04182C;
    --d-bg: #47260A; --d-ink: #FFEBD2; --d-edge: #F5A524; --d-solid: #F5A524; --d-on: #2A1500;
    --a-bg: #1F2C31; --a-ink: #E8F2F4; --a-edge: #8DB6C0; --a-solid: #8DB6C0; --a-on: #0A1A1E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1216;
  --surface: #171D23;
  --ink: #F1F5F9;
  --ink-2: #B6C2CE;
  --line: #6B7A8A;
  --focus: #FFD60A;

  --h-bg: #10304F; --h-ink: #E8F2FF; --h-edge: #6DB0FF; --h-solid: #6DB0FF; --h-on: #04182C;
  --d-bg: #47260A; --d-ink: #FFEBD2; --d-edge: #F5A524; --d-solid: #F5A524; --d-on: #2A1500;
  --a-bg: #1F2C31; --a-ink: #E8F2F4; --a-edge: #8DB6C0; --a-solid: #8DB6C0; --a-on: #0A1A1E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.5;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
button, textarea { font-family: inherit; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 役割ごとの色 */
.r-h, [data-role="h"] { --edge: var(--h-edge); --tint: var(--h-bg); --tx: var(--h-ink); --solid: var(--h-solid); --on: var(--h-on); }
.r-d, [data-role="d"] { --edge: var(--d-edge); --tint: var(--d-bg); --tx: var(--d-ink); --solid: var(--d-solid); --on: var(--d-on); }
.r-a, [data-role="a"] { --edge: var(--a-edge); --tint: var(--a-bg); --tx: var(--a-ink); --solid: var(--a-solid); --on: var(--a-on); }

/* 上部バー */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 0 0 auto; min-height: 48px; }
.brand { margin: 0; flex: 1 0 auto; font-size: 1.15rem; font-weight: 700; }
/* ロゴ+見出しは、3回続けて押すと「このアプリについて」が開く隠しボタン */
.brand-btn { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; touch-action: manipulation; }
.brand svg { flex: none; }
.quiet {
  min-height: 48px; padding: 0 14px; cursor: pointer;
  border: 2px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 1rem; font-weight: 700;
}
/* 2つのボタンは組にして、収まらないときは一緒に次の行へ回す */
.acts { display: flex; gap: 8px; margin-left: auto; }
/* ボタンを詰める段階: 幅が295px前後の端末(Chromeのズームが大きい)でもロゴ+見出しを残す */
.top.compact .quiet { padding: 0 4px; font-size: .8rem; }
.top.compact .acts { gap: 4px; }
.top.compact .brand-btn { gap: 6px; }
.top.compact .brand svg { width: 26px; height: auto; }
.quiet:disabled { cursor: default; color: var(--ink-2); border-style: dashed; }

/* 2分割 */
.stage { flex: 1 1 auto; min-height: 0; display: grid; gap: 10px; grid-template-rows: minmax(0, 7fr) minmax(0, 10fr); }
@media (min-aspect-ratio: 6/5) {
  .stage { grid-template-rows: none; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
}

/* 表示カード */
.card {
  --edge: var(--line); --tint: var(--surface); --tx: var(--ink);
  display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0;
  padding: 12px 16px 14px;
  border: 6px solid var(--edge); border-radius: 10px;
  background: var(--tint); color: var(--tx);
}
.who { display: flex; align-items: center; gap: 8px; flex: none; font-weight: 700; font-size: 1.05rem; }
.mark { width: 14px; height: 14px; flex: none; background: var(--edge); }
.card[data-role="h"] .mark { border-radius: 50%; }
.card[data-role="d"] .mark { transform: rotate(45deg) scale(.85); }
.card[data-role="e"] .mark { background: transparent; border: 3px solid var(--edge); }
.hist { flex: none; margin: 0; padding: 0; list-style: none; font-size: .95rem; }
.hist li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist:empty { display: none; }
.msgbox { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
.arrow { flex: none; color: var(--tx); }
.arrow svg { display: block; width: 100%; height: 100%; }
.msg { flex: 1 1 0; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.msg-t {
  display: block; width: 100%; text-align: center; font-weight: 700; line-height: 1.3;
  white-space: pre-line; overflow-wrap: anywhere; word-break: auto-phrase; text-wrap: balance;
}
.card[data-role="e"] .msg-t { font-size: clamp(1.25rem, 5vmin, 2.2rem); font-weight: 400; }

/* アプリを開いたときの案内の窓(「今後は表示しない」を押すまで出る) */
.intro-btns { display: flex; flex-direction: column; gap: 8px; }
.intro-hide { min-height: 48px; width: 100%; cursor: pointer; border: 3px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 1rem; font-weight: 700; }

/* ボタン側 */
.pad { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: none; }
.role-btn {
  min-height: 52px; padding: 6px 4px; cursor: pointer; line-height: 1.2;
  border: 3px solid var(--edge); border-radius: 6px;
  background: var(--tint); color: var(--tx); font-size: 1rem; font-weight: 700;
}
.role-btn[aria-pressed="true"] { background: var(--solid); color: var(--on); }
.role-btn[aria-pressed="true"]::before { content: "✓ "; }

/* 入力欄を開いたとき: 一覧を潰さず、ボタン側全体を縦にスクロールできるようにする */
/* 縦スクロールで左右がクリップされるので、枠線・フォーカス枠の分だけ余白をとる */
.pad.free-open { overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 6px 8px; }
.pad.free-open .list { flex: 0 0 8.5rem; }
.list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; padding: 2px 2px 8px; }
.grp h2 { margin: 0 0 6px; font-size: .95rem; font-weight: 700; color: var(--ink-2); }
.btns { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); }
.say {
  min-height: 56px; padding: 10px 14px; text-align: left; cursor: pointer;
  border: 3px solid var(--edge); border-radius: 6px;
  background: var(--tint); color: var(--tx); font-size: 1.05rem; font-weight: 700; line-height: 1.35;
}
.say:active { background: var(--solid); color: var(--on); }
.sug { padding: 10px; border: 3px solid var(--ink); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.sug h2 { margin: 0; font-size: 1rem; font-weight: 700; }

/* 方向で案内 */
.dir { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 44px; padding: 0 14px; cursor: pointer;
  border: 2px solid var(--edge); border-radius: 22px;
  background: var(--surface); color: var(--ink); font-size: 1rem; font-weight: 700;
}
.chip[aria-pressed="true"] { background: var(--solid); color: var(--on); border-color: var(--solid); }
.chip[aria-pressed="true"]::before { content: "✓ "; }
.arrows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.abtn {
  min-height: 76px; padding: 6px 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 3px solid var(--edge); border-radius: 6px;
  background: var(--tint); color: var(--tx); font-size: .95rem; font-weight: 700; line-height: 1.2;
}
.abtn:active { background: var(--solid); color: var(--on); }
.abtn .ico { display: block; width: 34px; height: 34px; }
.abtn .ico svg { display: block; width: 100%; height: 100%; }

/* 自由入力 */
.free { flex: none; display: flex; flex-direction: column; gap: 6px; }
.free-toggle {
  min-height: 52px; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 1.05rem; font-weight: 700;
}
.free-box { display: flex; flex-direction: column; gap: 6px; }
.free-box label { font-size: .95rem; font-weight: 700; }
.free-row { display: flex; gap: 6px; }
.free-row textarea {
  flex: 1 1 auto; min-width: 0; min-height: 56px; padding: 8px 10px; resize: none;
  border: 3px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 1.15rem; line-height: 1.4;
}
.free-row button {
  flex: none; min-height: 56px; padding: 0 16px; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 6px;
  background: var(--ink); color: var(--bg); font-size: 1.05rem; font-weight: 700;
}
.free-col { flex: none; display: flex; flex-direction: column; gap: 6px; }
/* 入力前だけ見える案内。コントラストは本文色(--ink-2)で確保する(WCAG 1.4.3) */
.free-row textarea::placeholder { color: var(--ink-2); opacity: 1; font-size: .85rem; line-height: 1.35; }
.free-row .free-col button { min-height: 48px; padding: 0 4px; font-size: .85rem; }
.free-row .free-col .free-save { background: var(--surface); color: var(--ink); }
.free-note { margin: 0; font-size: .8rem; line-height: 1.35; color: var(--ink-2); }

/* 自分の言葉(この端末に保存) */
.mine-row { display: flex; gap: 6px; }
.mine-row .say { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.mine-del {
  flex: none; min-width: 48px; min-height: 48px; cursor: pointer;
  border: 3px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-size: 1.2rem; font-weight: 700;
}
.mine-list { display: flex; flex-direction: column; gap: 8px; }

/* 狭い縦長の画面: 上部バーを1行に収め、返事の一覧に高さを回す */
.brand-name { white-space: nowrap; }
@media (max-width: 480px) {
  .quiet { padding: 0 8px; font-size: .95rem; white-space: nowrap; }
  .brand { font-size: .9rem; }
  .brand-btn { gap: 8px; }
  .sug { padding: 8px; }
  .free-toggle { min-height: 48px; }
}
@media (max-height: 440px) {
  .brand-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .role-btn { min-height: 46px; }
  .say { min-height: 52px; }
  .card { padding: 8px 12px 10px; }
}

/* このアプリについて(ダイアログ) */
.about { width: min(92vw, 26rem); padding: 16px; border: 3px solid var(--ink); border-radius: 10px; background: var(--surface); color: var(--ink); }
.about::backdrop { background: rgba(0, 0, 0, .6); }
.about h2 { margin: 0 0 4px; font-size: 1.25rem; }
.about p { margin: 0 0 12px; }
.about-ver { color: var(--ink-2); }
.about-links { margin: 0 0 12px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.about-links a { display: flex; align-items: center; min-height: 48px; padding: 0 10px; border: 3px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: underline; }
.about-note { font-size: .95rem; color: var(--ink-2); }
.about-erase { min-height: 48px; width: 100%; margin-bottom: 8px; cursor: pointer; border: 3px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 1rem; font-weight: 700; }
.about-close { min-height: 48px; width: 100%; cursor: pointer; border: 3px solid var(--ink); border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 1.05rem; font-weight: 700; }
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">
    <button type="button" class="brand-btn" id="about" aria-haspopup="dialog" aria-describedby="aboutHint">
    <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true" focusable="false">
      <rect x="1" y="1" width="20" height="14" rx="3" fill="var(--h-solid)"/>
      <path d="M5 15l-1 6 7-6z" fill="var(--h-solid)"/>
      <rect x="13" y="11" width="20" height="14" rx="3" fill="var(--d-solid)"/>
      <path d="M29 25l1 3-7-3z" fill="var(--d-solid)"/>
    </svg>
    <span class="brand-name">ひと目トーク</span>
    </button>
    <span class="sr" id="aboutHint">3回続けて押すと、このアプリについての窓が開きます。</span>
  </h1>
  <div class="acts">
    <button type="button" class="quiet" id="undo">ひとつ戻す</button>
    <button type="button" class="quiet" id="clear">全部消す</button>
  </div>
</header>

<main class="stage">
  <section class="card" id="card" data-role="e" aria-label="表示画面">
    <div class="who"><span class="mark" aria-hidden="true"></span><span id="whoText">はじめに</span></div>
    <ul class="hist" id="hist" aria-label="これまでのやりとり"></ul>
    <div class="msgbox" id="msgbox">
      <div class="arrow" id="arrow" hidden></div>
      <div class="msg" id="msg"><span class="msg-t" id="msgt"></span></div>
    </div>
  </section>

  <section class="pad" aria-label="メッセージを選ぶ">
    <div class="roles" role="group" aria-label="だれが伝えますか">
      <button type="button" class="role-btn r-h" data-tab="h" data-key="role:h" aria-pressed="false">聞こえる人</button>
      <button type="button" class="role-btn r-d" data-tab="d" data-key="role:d" aria-pressed="true">聞こえない人</button>
      <button type="button" class="role-btn r-a" data-tab="a" data-key="role:a" aria-pressed="false">どちらでも</button>
    </div>
    <div class="list" id="list" tabindex="-1"></div>
    <div class="free">
      <button type="button" class="free-toggle" id="freeToggle" aria-expanded="false" aria-controls="freeBox">文字を入力して表示</button>
      <div class="free-box" id="freeBox" hidden>
        <label for="free">文字を入力（<span id="freeAs"></span>として表示）</label>
        <div class="free-row">
          <textarea id="free" rows="2" maxlength="100" autocomplete="off" placeholder="キーボードの&#10;マイクからでも&#10;入力できます"></textarea>
          <div class="free-col">
            <button type="button" id="freeSend">大きく表示</button>
            <button type="button" class="free-save" id="freeSave">ボタンに保存</button>
          </div>
        </div>
        <p class="free-note" id="freeNote">「ボタンに保存」を押すと、入力した言葉が、この端末だけに保存されます。</p>
      </div>
    </div>
  </section>
</main>

<div class="sr" id="sr" role="status" aria-live="polite"></div>

<dialog class="about" id="introDlg" aria-labelledby="introTitle">
  <h2 id="introTitle">お知らせ</h2>
  <p>左上のロゴ（ひと目トーク）を3回続けて押すと、使い方・更新のお知らせ・ご意見の送り先・権利の案内が見られます。</p>
  <div class="intro-btns">
    <button type="button" class="about-close" id="introClose" autofocus>とじる</button>
    <button type="button" class="intro-hide" id="introHide">今後は表示しない</button>
  </div>
</dialog>

<dialog class="about" id="aboutDlg" aria-labelledby="aboutTitle">
  <h2 id="aboutTitle">このアプリについて</h2>
  <p class="about-ver">ひと目トーク　<span id="aboutVer"></span></p>
  <ul class="about-links">
    <li><a href="help.html" target="_blank" rel="noopener">使い方</a></li>
    <li><a href="changelog.html" target="_blank" rel="noopener">更新のお知らせ</a></li>
    <li><a href="license.html" target="_blank" rel="noopener">権利・ライセンス</a></li>
    <li id="feedbackRow" hidden><a id="feedbackLink" href="#" target="_blank" rel="noopener noreferrer">ご意見・ふぐあいを送る</a></li>
  </ul>
  <p class="about-note">リンクは別のタブで開きます。アプリの表示内容は送られません。</p>
  <button type="button" class="about-erase" id="aboutErase" hidden>保存した言葉をすべて消す</button>
  <button type="button" class="about-close" id="aboutClose">とじる</button>
</dialog>

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };

  function el(tag, attrs) {
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null) continue;
        n.append(c.nodeType ? c : document.createTextNode(c));
      }
    }
    return n;
  }

  var ARROW = '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M8 40h50V16l34 34-34 34V60H8z" fill="currentColor"/></svg>';

  var ROLE = {
    h: { from: '聞こえる人より', short: '聞こえる人' },
    d: { from: '聞こえない人より', short: '聞こえない人' },
    a: { from: '返事', short: '返事' }
  };

  /* 定型文。r=話す人(h:聞こえる人 d:聞こえない人 a:どちらでも)、next=このあとの返事の候補 */
  var SIT_NEXT = ['d_where', 'd_danger', 'd_when', 'ok'];
  var MSG = {
    /* 聞こえない人から */
    d_intro:   { r: 'd', t: '耳が聞こえません。画面で教えてください。', next: ['h_stop', 'h_quake', 'h_fire', 'h_power', 'h_safe', 'h_unknown', 'tool:free'] },

    if (last && last.dir) {
      var s = Math.max(40, Math.min(H * 0.52, W * 0.6));
      arrow.style.width = s + 'px';
      arrow.style.height = s + 'px';
      arrow.hidden = false;
    } else {
      arrow.hidden = true;
    }
    /* はじめの案内文も枠に収める(上限だけ小さくする) */
    var lo = 12, hi = last ? 320 : 36;
    while (hi - lo > 1) {
      var mid = Math.floor((lo + hi) / 2);
      t.style.fontSize = mid + 'px';
      if (t.offsetHeight <= msg.clientHeight + 1 && t.scrollWidth <= msg.clientWidth + 1) lo = mid;

  function fitHeader() {

    function shrink() {

        brand.style.fontSize = px + 'px';
        if (oneRow()) return true;

      return oneRow();

    if (shrink()) return;
    top.classList.add('compact');
